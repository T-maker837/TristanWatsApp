<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messagerie</title>
<style>
:root{--bg:#efeae2;--head:#8359f7;--mine:#d9fdd3;--other:#fff;--text:#111b21;--sub:#667781;--bar:#f0f2f5;--chip:#e1f3fb}
@media (prefers-color-scheme:dark){:root{--bg:#0b141a;--head:#202c33;--mine:#eb7d00;--other:#202c33;--text:#e9edef;--sub:#8696a0;--bar:#202c33;--chip:#182229}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
header{background:var(--head);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header input{flex:1;min-width:0;background:rgba(255,255,255,.15);color:#fff;border-radius:16px;padding:8px 12px}
header small{opacity:.85;font-size:12px;white-space:nowrap}header a{cursor:pointer;font-size:13px}
#list{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;background:var(--chip);color:var(--sub);font-size:12px;padding:4px 10px;border-radius:8px;margin:8px 0}
.m{max-width:80%;padding:6px 9px 4px;border-radius:8px;background:var(--other);box-shadow:0 1px 1px rgba(0,0,0,.13);word-wrap:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--mine)}
.m .n{font-size:12px;font-weight:600;color:#06a884;display:block}
.m .t{float:right;margin:6px 0 0 10px;font-size:11px;color:var(--sub)}
.hbtn{background:transparent;width:38px;height:38px;font-size:20px}
#callbar{background:var(--chip);color:var(--text);padding:8px 14px;display:flex;align-items:center;gap:10px;font-size:14px}
#callbar button{border-radius:16px;width:auto;height:auto;padding:6px 14px;font-size:14px}
#call{position:fixed;inset:0;background:#111;z-index:9;display:flex;flex-direction:column}
#grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));grid-auto-rows:1fr;gap:6px;padding:8px;padding-top:max(8px,env(safe-area-inset-top))}
.tile{position:relative;background:#222;border-radius:10px;overflow:hidden;min-height:0}
.tile video{width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;left:8px;bottom:6px;color:#fff;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:10px;font-size:12px}
#ctl{display:flex;justify-content:center;gap:16px;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
#ctl button{width:52px;height:52px;background:#3b4a54}
#ctl .off{background:#8a2a2a}#ctl #hang{background:#d33}
.hide{display:none!important}
</style></head><body>
<div id="auth">
  <div style="font-size:48px">💬</div><h2 style="margin:0">Messagerie</h2>
  <input id="name" placeholder="Pseudo" maxlength="24" autocomplete="username">
  <input id="pass" type="password" placeholder="Mot de passe" autocomplete="current-password">
  <div id="err"></div>
  <button id="ok">Se connecter</button>
  <a id="sw">Pas de compte ? Créer un compte</a>
</div>
<header class="hide" id="head"><input id="room" placeholder="Salon" maxlength="48"><button class="hbtn" id="vc" aria-label="Appel vidéo">📹</button><small id="st">…</small><a id="out">Quitter</a></header>
<div id="list" class="hide"></div>
<div id="callbar" class="hide"><span id="cbt"></span><button id="cbj">Rejoindre</button></div>
<div id="call" class="hide"><div id="grid"></div><div id="ctl"><button id="mic" aria-label="Micro">🎤</button><button id="cam" aria-label="Caméra">📷</button><button id="hang" aria-label="Raccrocher">📞</button></div></div>
<div class="bar hide" id="bar"><input type="file" id="file" class="hide"><button class="clip" id="clip" aria-label="Joindre">📎</button><textarea id="in" rows="1" placeholder="Écrire un message"></textarea><button id="go" aria-label="Envoyer">➤</button></div>
<script>
const $=i=>document.getElementById(i);
let token=localStorage.getItem('tk'),me=null,reg=false,msgs=[],last=0,rm='general',timer=null,first=true;
const hm=t=>new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const dayLabel=t=>{const d=new Date(t),n=new Date(),k=x=>x.toDateString();if(k(d)===k(n))return "Aujourd'hui";if(k(d)===k(new Date(n-864e5)))return 'Hier';return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})};
const api=async(p,o={})=>{const r=await fetch(p,{...o,headers:{...(o.headers||{}),Authorization:'Bearer '+token}});const j=await r.json().catch(()=>({}));if(r.status===401&&token){logout();throw 0}if(!r.ok)throw new Error(j.error||'Erreur');return j};
function logout(){if(typeof hang==='function')hang();localStorage.removeItem('tk');token=null;clearInterval(timer);['head','list','bar'].forEach(i=>$(i).classList.add('hide'));$('auth').classList.remove('hide')}
function render(){
  const l=$('list'),near=l.scrollHeight-l.scrollTop-l.clientHeight<120;l.textContent='';
  if(!msgs.length){const e=document.createElement('div');e.className='empty';e.textContent='Aucun message. Écrivez le premier !';l.append(e);return}
  let ld='';
  for(const m of msgs){
    const dl=dayLabel(m.ts);if(dl!==ld){const d=document.createElement('div');d.className='day';d.textContent=dl;l.append(d);ld=dl}
    const el=document.createElement('div'),mine=m.uid===me;el.className='m'+(mine?' me':'');
    if(!mine){const n=document.createElement('span');n.className='n';n.textContent=m.name;el.append(n)}
    if(m.file){const a=document.createElement('a');a.className='file';a.href='/api/file/'+m.file.id+'?token='+token;a.textContent='📄 '+m.file.name+' ';
      const s=document.createElement('small');s.textContent=Math.max(1,Math.round(m.file.size/1024))+' Ko';a.append(s);el.append(a)}
    if(m.text)el.append(document.createTextNode(m.text));
    const t=document.createElement('span');t.className='t';t.textContent=hm(m.ts);el.append(t);l.append(el);
  }
  if(near||first){l.scrollTop=l.scrollHeight;first=false}
}
async function poll(){
  try{const r=await api('/api/messages?room='+encodeURIComponent(rm)+'&after='+last);
    if(r.messages.length){msgs.push(...r.messages);last=msgs[msgs.length-1].id;render()}else if(!last&&first)render();
    banner(r.call||[]);$('st').textContent='En ligne'}catch(e){if(token)$('st').textContent='Hors ligne'}
}
function openRoom(){rm=($('room').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'-')||'general');$('room').value=rm;localStorage.setItem('rm',rm);msgs=[];last=0;first=true;render();poll()}
async function start(){
  try{me=(await api('/api/me')).id}catch(_){return}
  $('auth').classList.add('hide');['head','list','bar'].forEach(i=>$(i).classList.remove('hide'));
  $('room').value=localStorage.getItem('rm')||'general';openRoom();clearInterval(timer);timer=setInterval(poll,1500);
}
$('sw').onclick=()=>{reg=!reg;$('ok').textContent=reg?'Créer le compte':'Se connecter';$('sw').textContent=reg?'Déjà un compte ? Se connecter':'Pas de compte ? Créer un compte'};
$('ok').onclick=async()=>{
  $('err').textContent='';
  try{const r=await fetch(reg?'/api/register':'/api/login',{method:'POST',body:JSON.stringify({name:$('name').value,pass:$('pass').value})});const j=await r.json();
    if(!r.ok)throw new Error(j.error);token=j.token;localStorage.setItem('tk',token);start()}catch(e){$('err').textContent=e.message}
};
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('ok').click()});
$('room').addEventListener('change',openRoom);$('out').onclick=logout;
async function send(){
  const text=$('in').value.trim();if(!text)return;$('in').value='';$('in').style.height='auto';
  try{await api('/api/messages',{method:'POST',body:JSON.stringify({room:rm,text})});poll()}catch(e){$('in').value=text;$('st').textContent=e.message}
}
$('go').onclick=send;
$('in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('in').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'});
$('clip').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(f.size>50*1024*1024){alert('Fichier trop volumineux (50 Mo maximum).');return}
  $('st').textContent='Envoi…';const cap=$('in').value.trim();
  try{await api('/api/upload?room='+encodeURIComponent(rm)+'&name='+encodeURIComponent(f.name)+'&type='+encodeURIComponent(f.type)+'&caption='+encodeURIComponent(cap),{method:'POST',body:f});$('in').value='';poll()}
  catch(err){$('st').textContent='Échec : '+err.message}
};

/* ---------- Appel vidéo (WebRTC, maillage) ---------- */
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
let stream=null,pcs={},pend={},inCall=false,sigTimer=null,sigBusy=false,callRoom=null;
function banner(call){const n=call.length;$('callbar').classList.toggle('hide',!n||inCall);if(n)$('cbt').textContent='📹 Appel vidéo en cours ('+n+' personne'+(n>1?'s':'')+')'}
const sig=(to,data)=>api('/api/signal',{method:'POST',body:JSON.stringify({to,data})}).catch(()=>{});
function tile(id,st,muted,label){
  let t=document.getElementById('t-'+id);
  if(!t){t=document.createElement('div');t.className='tile';t.id='t-'+id;const v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.muted=muted;
    const l=document.createElement('span');l.textContent=label;t.append(v,l);$('grid').append(t)}
  t.firstChild.srcObject=st;
}
function drop(id){if(pcs[id]){try{pcs[id].close()}catch(_){}delete pcs[id]}delete pend[id];const t=document.getElementById('t-'+id);if(t)t.remove()}
async function makePC(id,name,init){
  const pc=new RTCPeerConnection(ICE);pcs[id]=pc;pend[id]=[];
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  pc.onicecandidate=e=>{if(e.candidate)sig(id,{type:'cand',c:e.candidate})};
  pc.ontrack=e=>tile(id,e.streams[0],false,name);
  pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))drop(id)};
  if(init){await pc.setLocalDescription(await pc.createOffer());sig(id,{type:'offer',sdp:pc.localDescription})}
  return pc;
}
async function flush(id){const pc=pcs[id];for(const c of pend[id]||[])try{await pc.addIceCandidate(c)}catch(_){}pend[id]=[]}
async function sigPoll(){
  if(sigBusy||!inCall)return;sigBusy=true;
  try{
    const r=await api('/api/signal');
    for(const s of r.signals){
      const d=s.data,id=s.from;
      if(d.type==='bye'){drop(id);continue}
      if(d.type==='offer'){
        const pc=pcs[id]||await makePC(id,s.name,false);
        await pc.setRemoteDescription(d.sdp);await flush(id);
        await pc.setLocalDescription(await pc.createAnswer());sig(id,{type:'answer',sdp:pc.localDescription});
      }else if(d.type==='answer'&&pcs[id]){await pcs[id].setRemoteDescription(d.sdp);await flush(id)}
      else if(d.type==='cand'&&pcs[id]){if(pcs[id].remoteDescription)try{await pcs[id].addIceCandidate(d.c)}catch(_){}else pend[id].push(d.c)}
    }
  }catch(_){}
  sigBusy=false;
}
async function joinCall(){
  if(inCall)return;
  if(!navigator.mediaDevices||!window.RTCPeerConnection){alert('Appel vidéo indisponible : ouvrez le site en HTTPS (ou sur localhost).');return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true})}
  catch(_){try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){alert('Accès au micro/à la caméra refusé.');return}}
  inCall=true;callRoom=rm;$('callbar').classList.add('hide');
  $('call').classList.remove('hide');tile('me',stream,true,'Moi');
  $('cam').classList.toggle('off',!stream.getVideoTracks().length);$('mic').classList.remove('off');
  try{
    const r=await api('/api/call/join',{method:'POST',body:JSON.stringify({room:rm})});
    for(const p of r.peers)await makePC(p.uid,p.name,true);
    sigTimer=setInterval(sigPoll,700);
  }catch(e){alert(e.message||'Impossible de rejoindre l’appel');hang()}
}
function hang(){
  if(!inCall)return;inCall=false;clearInterval(sigTimer);
  api('/api/call/leave',{method:'POST',body:JSON.stringify({room:callRoom})}).catch(()=>{});
  Object.keys(pcs).forEach(drop);
  if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;
  $('grid').textContent='';$('call').classList.add('hide');
}
function toggle(kind,btn){
  const ts=kind==='audio'?stream.getAudioTracks():stream.getVideoTracks();if(!ts.length)return;
  const on=!ts[0].enabled;ts.forEach(t=>t.enabled=on);btn.classList.toggle('off',!on);
}
$('vc').onclick=joinCall;$('cbj').onclick=joinCall;$('hang').onclick=hang;
$('mic').onclick=e=>toggle('audio',e.currentTarget);$('cam').onclick=e=>toggle('video',e.currentTarget);
if(token)start();
</script></body></html>
