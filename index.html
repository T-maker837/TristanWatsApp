<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messagerie</title>
<style>
:root{--bg:#efeae2;--head:#008069;--mine:#d9fdd3;--other:#fff;--text:#111b21;--sub:#667781;--bar:#f0f2f5;--chip:#e1f3fb}
@media (prefers-color-scheme:dark){:root{--bg:#0b141a;--head:#202c33;--mine:#005c4b;--other:#202c33;--text:#e9edef;--sub:#8696a0;--bar:#202c33;--chip:#182229}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
header{background:var(--head);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px}
header input{flex:1;min-width:0;background:rgba(255,255,255,.15);color:#fff;border-radius:16px;padding:8px 12px}
header small{opacity:.85;font-size:12px;white-space:nowrap}header a{cursor:pointer;font-size:13px}
#list{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;background:var(--chip);color:var(--sub);font-size:12px;padding:4px 10px;border-radius:8px;margin:8px 0}
.m{max-width:80%;padding:6px 9px 4px;border-radius:8px;background:var(--other);box-shadow:0 1px 1px rgba(0,0,0,.13);word-wrap:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--mine)}
.m .n{font-size:12px;font-weight:600;color:#06a884;display:block}
.m .t{float:right;margin:6px 0 0 10px;font-size:11px;color:var(--sub)}
.file{display:flex;align-items:center;gap:8px;padding:8px;background:rgba(0,0,0,.07);border-radius:6px;margin-bottom:4px;color:inherit;text-decoration:none;cursor:pointer}
.file small{color:var(--sub)}
.empty{margin:auto;color:var(--sub);text-align:center}
.bar{display:flex;gap:8px;padding:8px 10px;background:var(--bar)}
textarea,input{border:0;border-radius:20px;padding:10px 14px;font:inherit;background:var(--other);color:var(--text);outline:none}
textarea{flex:1;resize:none;max-height:110px}
button{border:0;border-radius:50%;width:44px;height:44px;background:#00a884;color:#fff;font-size:20px;cursor:pointer}
.clip{background:transparent;color:var(--sub);font-size:24px;width:40px}
.hbtn{background:transparent;width:38px;height:38px;font-size:20px}
#auth,#cfg{margin:auto;padding:24px;display:flex;flex-direction:column;gap:12px;width:min(340px,90%);text-align:center}
#auth button{border-radius:20px;width:auto;height:auto;padding:12px;font-size:16px}
#auth a{color:var(--sub);font-size:13px;cursor:pointer}#err{font-size:13px;min-height:16px;color:#d33}
#rooms{position:fixed;inset:0;background:var(--bg);z-index:8;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
#rooms .top{background:var(--head);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;padding-top:max(12px,env(safe-area-inset-top))}
#rooms .top b{flex:1;font-size:16px}#rooms .top a{cursor:pointer;font-size:24px;line-height:1}
#rl{overflow-y:auto;flex:1}
.rr{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid rgba(128,128,128,.2)}
.rr:hover{background:var(--chip)}.rr .a{width:44px;height:44px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.rr .i{flex:1;min-width:0}.rr .i b{display:block}.rr .i small{display:block;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr .r{text-align:right;font-size:12px;color:var(--sub);flex:none}
#callbar{background:var(--chip);padding:8px 14px;display:flex;align-items:center;gap:10px;font-size:14px}
#callbar button{border-radius:16px;width:auto;height:auto;padding:6px 14px;font-size:14px}
#call{position:fixed;inset:0;background:#111;z-index:9;display:flex;flex-direction:column}
#grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));grid-auto-rows:1fr;gap:6px;padding:8px;padding-top:max(8px,env(safe-area-inset-top))}
.tile{position:relative;background:#222;border-radius:10px;overflow:hidden;min-height:0}
.tile video{width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;left:8px;bottom:6px;color:#fff;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:10px;font-size:12px}
#ctl{display:flex;justify-content:center;gap:16px;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
#ctl button{width:52px;height:52px;background:#3b4a54}#ctl .off{background:#8a2a2a}#ctl #hang{background:#d33}
.hide{display:none!important}
</style></head><body>
<div id="cfg" class="hide"><h2>Configuration requise</h2><p>Renseignez <b>SUPABASE_URL</b> et <b>SUPABASE_KEY</b> en haut du script de <code>index.html</code> (voir le README).</p></div>
<div id="auth" class="hide">
  <div style="font-size:48px">💬</div><h2 style="margin:0">Messagerie</h2>
  <input id="pseudo" class="hide" placeholder="Pseudo" maxlength="24" autocomplete="nickname">
  <input id="email" type="email" placeholder="E-mail" autocomplete="email">
  <input id="pass" type="password" placeholder="Mot de passe (6 caractères min.)" autocomplete="current-password">
  <div id="err"></div>
  <button id="ok">Se connecter</button>
  <a id="sw">Pas de compte ? Créer un compte</a>
</div>
<header class="hide" id="head"><input id="room" placeholder="Salon" maxlength="48"><button class="hbtn" id="rb" aria-label="Tous les salons">🗂</button><button class="hbtn" id="vc" aria-label="Appel vidéo">📹</button><small id="st">…</small><a id="out">Quitter</a></header>
<div id="rooms" class="hide"><div class="top"><b>Tous les salons</b><a id="rx" aria-label="Fermer">×</a></div><div id="rl"></div></div>
<div id="callbar" class="hide"><span id="cbt"></span><button id="cbj">Rejoindre</button></div>
<div id="call" class="hide"><div id="grid"></div><div id="ctl"><button id="mic" aria-label="Micro">🎤</button><button id="cam" aria-label="Caméra">📷</button><button id="hang" aria-label="Raccrocher">📞</button></div></div>
<div id="list" class="hide"></div>
<div class="bar hide" id="bar"><input type="file" id="file" class="hide"><button class="clip" id="clip" aria-label="Joindre">📎</button><textarea id="in" rows="1" placeholder="Écrire un message"></textarea><button id="go" aria-label="Envoyer">➤</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://qnvcwkhooozsebrwzclj.supabase.co';
const SUPABASE_KEY='sb_publishable_rTLFlgvuCXetFJ0rmR9nUA_vGrlU7ZB';

const $=i=>document.getElementById(i);
if(SUPABASE_URL.startsWith('COLLEZ')||!window.supabase){$('cfg').classList.remove('hide')}else main();

function main(){
const sb=supabase.createClient(new URL(SUPABASE_URL.trim()).origin,SUPABASE_KEY.trim());
let me=null,myName='',msgs=[],seen=new Set(),last=0,rm='general',first=true,reg=false,pollT=null,rtCh=null;
const hm=t=>new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const dayLabel=t=>{const d=new Date(t),n=new Date(),k=x=>x.toDateString();if(k(d)===k(n))return "Aujourd'hui";if(k(d)===k(new Date(n-864e5)))return 'Hier';return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})};
const slug=v=>(v.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'-').slice(0,48)||'general');

/* ---------- Connexion ---------- */
function showChat(on){['head','list','bar'].forEach(i=>$(i).classList.toggle('hide',!on));$('auth').classList.toggle('hide',on)}
async function start(session){
  if(me)return;me=session.user.id;myName=(session.user.user_metadata||{}).name||'Anonyme';
  showChat(true);$('room').value=localStorage.getItem('rm')||'general';openRoom();
  clearInterval(pollT);pollT=setInterval(poll,4000);
}
function stopAll(){me=null;clearInterval(pollT);if(rtCh){sb.removeChannel(rtCh);rtCh=null}hang();unwatchCall();msgs=[];seen.clear();last=0;showChat(false)}
sb.auth.onAuthStateChange((ev,s)=>{if(s&&!me)start(s);else if(!s&&me)stopAll()});
sb.auth.getSession().then(({data})=>{if(data.session)start(data.session);else showChat(false)});
$('sw').onclick=()=>{reg=!reg;$('pseudo').classList.toggle('hide',!reg);$('ok').textContent=reg?'Créer le compte':'Se connecter';$('sw').textContent=reg?'Déjà un compte ? Se connecter':'Pas de compte ? Créer un compte'};
$('ok').onclick=async()=>{
  $('err').textContent='';const email=$('email').value.trim(),password=$('pass').value;
  try{
    if(reg){
      const name=$('pseudo').value.trim();if(name.length<2){throw new Error('Pseudo de 2 caractères minimum.')}
      const {data,error}=await sb.auth.signUp({email,password,options:{data:{name}}});if(error)throw error;
      if(!data.session)$('err').textContent='Compte créé. Vérifiez votre e-mail pour le confirmer, puis connectez-vous.';
    }else{const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error}
  }catch(e){$('err').textContent=e.message||'Erreur'}
};
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('ok').click()});
$('out').onclick=()=>sb.auth.signOut();

/* ---------- Messages ---------- */
function render(){
  const l=$('list'),near=l.scrollHeight-l.scrollTop-l.clientHeight<120;l.textContent='';
  if(!msgs.length){const e=document.createElement('div');e.className='empty';e.textContent='Aucun message. Écrivez le premier !';l.append(e);return}
  let ld='';
  for(const m of msgs){
    const ts=new Date(m.created_at).getTime(),dl=dayLabel(ts);
    if(dl!==ld){const d=document.createElement('div');d.className='day';d.textContent=dl;l.append(d);ld=dl}
    const el=document.createElement('div'),mine=m.uid===me;el.className='m'+(mine?' me':'');
    if(!mine){const n=document.createElement('span');n.className='n';n.textContent=m.name;el.append(n)}
    if(m.file){const f=m.file,a=document.createElement('a');a.className='file';a.textContent='📄 '+f.name+' ';
      const s=document.createElement('small');s.textContent=Math.max(1,Math.round(f.size/1024))+' Ko';a.append(s);
      a.onclick=async()=>{const {data,error}=await sb.storage.from('files').createSignedUrl(f.path,60,{download:f.name});if(error)alert('Fichier indisponible');else location.href=data.signedUrl};
      el.append(a)}
    if(m.text)el.append(document.createTextNode(m.text));
    const t=document.createElement('span');t.className='t';t.textContent=hm(ts);el.append(t);l.append(el);
  }
  if(near||first){l.scrollTop=l.scrollHeight;first=false}
}
function addMsgs(rows,r){
  if(r!==rm)return;let ch=false;
  for(const m of rows){if(m.room!==rm||seen.has(m.id))continue;seen.add(m.id);msgs.push(m);ch=true;if(m.id>last)last=m.id}
  if(ch){msgs.sort((a,b)=>a.id-b.id);render()}
}
async function poll(){
  const r=rm;
  const {data,error}=await sb.from('messages').select('*').eq('room',r).gt('id',last).order('id');
  if(error){$('st').textContent='Hors ligne';return}
  $('st').textContent='En ligne';addMsgs(data,r);
}
function openRoom(){
  if(inCall)hang();
  rm=slug($('room').value);$('room').value=rm;localStorage.setItem('rm',rm);
  msgs=[];seen.clear();last=0;first=true;render();
  const r=rm;
  sb.from('messages').select('*').eq('room',r).order('id',{ascending:false}).limit(200).then(({data,error})=>{
    if(error){$('st').textContent='Hors ligne';return}$('st').textContent='En ligne';addMsgs(data,r);render()});
  if(rtCh)sb.removeChannel(rtCh);
  rtCh=sb.channel('msgs-'+r).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'room=eq.'+r},p=>addMsgs([p.new],r)).subscribe();
  watchCall();
}
$('room').addEventListener('change',openRoom);
async function send(){
  const text=$('in').value.trim();if(!text)return;$('in').value='';$('in').style.height='auto';
  const {error}=await sb.from('messages').insert({room:rm,text});
  if(error){$('in').value=text;$('st').textContent='Envoi impossible';return}poll();
}
$('go').onclick=send;
$('in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('in').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'});

/* ---------- Fichiers ---------- */
$('clip').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(f.size>50*1024*1024){alert('Fichier trop volumineux (50 Mo maximum).');return}
  $('st').textContent='Envoi…';const cap=$('in').value.trim();
  try{
    const path=me+'/'+Date.now()+'-'+f.name.replace(/[^\w.\-]+/g,'_').slice(-80);
    let r=await sb.storage.from('files').upload(path,f,{contentType:f.type||'application/octet-stream'});if(r.error)throw r.error;
    r=await sb.from('messages').insert({room:rm,text:cap,file:{path,name:f.name,size:f.size,type:f.type}});if(r.error)throw r.error;
    $('in').value='';$('st').textContent='En ligne';poll();
  }catch(err){$('st').textContent='Échec : '+(err.message||'envoi')}
};

/* ---------- Liste des salons ---------- */
$('rb').onclick=async()=>{
  $('rooms').classList.remove('hide');const l=$('rl');l.textContent='Chargement…';l.style.padding='16px';
  const {data,error}=await sb.rpc('list_rooms',{cur:rm});
  if(error){l.textContent='Impossible de charger la liste.';return}
  l.textContent='';l.style.padding='0';
  const rows=data.slice();if(!rows.some(x=>x.rname==='general'))rows.push({rname:'general',nb:0,ts_last:null,last_text:''});
  for(const x of rows){
    const d=document.createElement('div');d.className='rr';
    const a=document.createElement('div');a.className='a';a.textContent=x.rname.replace(/^_/,'').slice(0,2).toUpperCase();
    const i=document.createElement('div');i.className='i';const b=document.createElement('b');b.textContent=x.rname+(x.rname===rm?' (actuel)':'');
    const sm=document.createElement('small');sm.textContent=(x.last_text||'Aucun message').slice(0,80);i.append(b,sm);
    const t=document.createElement('div');t.className='r';t.textContent=(x.ts_last?hm(x.ts_last)+' · ':'')+x.nb+' msg';
    d.append(a,i,t);d.onclick=()=>{$('room').value=x.rname;openRoom();$('rooms').classList.add('hide')};l.append(d);
  }
};
$('rx').onclick=()=>$('rooms').classList.add('hide');

/* ---------- Appel vidéo (WebRTC + signalisation Supabase Realtime) ---------- */
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
let cch=null,stream=null,pcs={},pend={},inCall=false,sigQ=Promise.resolve();
function others(){return cch?Object.keys(cch.presenceState()).filter(k=>k!==me):[]}
function pname(k){const s=cch&&cch.presenceState()[k];return(s&&s[0]&&s[0].name)||'Invité'}
function unwatchCall(){if(cch){sb.removeChannel(cch);cch=null}$('callbar').classList.add('hide')}
function banner(){const n=others().length;$('callbar').classList.toggle('hide',!n||inCall);if(n)$('cbt').textContent='📹 Appel vidéo en cours ('+n+' personne'+(n>1?'s':'')+')'}
function watchCall(){
  unwatchCall();
  cch=sb.channel('call:'+rm,{config:{broadcast:{self:false},presence:{key:me}}});
  cch.on('presence',{event:'sync'},()=>{banner();if(inCall)others().forEach(ensurePeer)})
     .on('presence',{event:'leave'},({key})=>{if(key!==me)drop(key);banner()})
     .on('broadcast',{event:'sig'},({payload})=>{sigQ=sigQ.then(()=>onSig(payload)).catch(()=>{})})
     .subscribe();
}
const sig=(to,data)=>cch&&cch.send({type:'broadcast',event:'sig',payload:{to,from:me,name:myName,data}});
function tile(id,st,muted,label){
  let t=document.getElementById('t-'+id);
  if(!t){t=document.createElement('div');t.className='tile';t.id='t-'+id;const v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.muted=muted;
    const l=document.createElement('span');l.textContent=label;t.append(v,l);$('grid').append(t)}
  t.firstChild.srcObject=st;
}
function drop(id){if(pcs[id]){try{pcs[id].close()}catch(_){}delete pcs[id]}delete pend[id];const t=document.getElementById('t-'+id);if(t)t.remove()}
async function makePC(id,name,init){
  const pc=new RTCPeerConnection(ICE);pcs[id]=pc;pend[id]=[];
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  pc.onicecandidate=e=>{if(e.candidate)sig(id,{type:'cand',c:e.candidate})};
  pc.ontrack=e=>tile(id,e.streams[0],false,name);
  pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))drop(id)};
  if(init){await pc.setLocalDescription(await pc.createOffer());sig(id,{type:'offer',sdp:pc.localDescription})}
  return pc;
}
/* Règle anti-collision : seul l'identifiant le plus grand envoie l'offre */
function ensurePeer(k){if(inCall&&!pcs[k]&&me>k)makePC(k,pname(k),true)}
async function flush(id){for(const c of pend[id]||[])try{await pcs[id].addIceCandidate(c)}catch(_){}pend[id]=[]}
async function onSig(p){
  if(!inCall||p.to!==me)return;const id=p.from,d=p.data;
  if(d.type==='offer'){
    const pc=pcs[id]||await makePC(id,p.name,false);
    await pc.setRemoteDescription(d.sdp);await flush(id);
    await pc.setLocalDescription(await pc.createAnswer());sig(id,{type:'answer',sdp:pc.localDescription});
  }else if(d.type==='answer'&&pcs[id]){await pcs[id].setRemoteDescription(d.sdp);await flush(id)}
  else if(d.type==='cand'&&pcs[id]){if(pcs[id].remoteDescription)try{await pcs[id].addIceCandidate(d.c)}catch(_){}else pend[id].push(d.c)}
}
async function joinCall(){
  if(inCall||!cch)return;
  if(!navigator.mediaDevices||!window.RTCPeerConnection){alert('Appel vidéo indisponible : le site doit être en HTTPS.');return}
  const o=others();if(o.length>=5){alert('Appel complet (6 personnes maximum).');return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true})}
  catch(_){try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){alert('Accès au micro/à la caméra refusé.');return}}
  inCall=true;$('callbar').classList.add('hide');$('call').classList.remove('hide');tile('me',stream,true,'Moi');
  $('cam').classList.toggle('off',!stream.getVideoTracks().length);$('mic').classList.remove('off');
  if(!o.length)sb.from('messages').insert({room:rm,text:'📞 a lancé un appel vidéo'}).then(poll);
  await cch.track({name:myName});o.forEach(ensurePeer);
}
function hang(){
  if(!inCall)return;inCall=false;
  if(cch)cch.untrack();Object.keys(pcs).forEach(drop);
  if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;
  $('grid').textContent='';$('call').classList.add('hide');banner();
}
function toggle(kind,btn){const ts=kind==='audio'?stream.getAudioTracks():stream.getVideoTracks();if(!ts.length)return;const on=!ts[0].enabled;ts.forEach(t=>t.enabled=on);btn.classList.toggle('off',!on)}
$('vc').onclick=joinCall;$('cbj').onclick=joinCall;$('hang').onclick=hang;
$('mic').onclick=e=>toggle('audio',e.currentTarget);$('cam').onclick=e=>toggle('video',e.currentTarget);
}
</script></body></html>
