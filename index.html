<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messagerie</title>
<style>
:root{--bg:#efeae2;--head:#008069;--mine:#d9fdd3;--other:#fff;--text:#111b21;--sub:#667781;--bar:#f0f2f5;--chip:#e1f3fb}
@media (prefers-color-scheme:dark){:root{--bg:#0b141a;--head:#202c33;--mine:#005c4b;--other:#202c33;--text:#e9edef;--sub:#8696a0;--bar:#202c33;--chip:#182229}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
header{background:var(--head);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}
.av{width:38px;height:38px;border-radius:50%;background:#25d366;display:grid;place-items:center;font-size:20px}
header b{display:block;font-size:16px}header small{opacity:.8;font-size:12px}
header a{margin-left:auto;color:#fff;font-size:13px;opacity:.85;cursor:pointer}
#list{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;background:var(--chip);color:var(--sub);font-size:12px;padding:4px 10px;border-radius:8px;margin:8px 0}
.m{max-width:80%;padding:6px 9px 4px;border-radius:8px;background:var(--other);box-shadow:0 1px 1px rgba(0,0,0,.13);word-wrap:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--mine)}
.m .n{font-size:12px;font-weight:600;color:#06a884;display:block}
.m .t{float:right;margin:6px 0 0 10px;font-size:11px;color:var(--sub)}
.empty{margin:auto;color:var(--sub);text-align:center}
.bar{display:flex;gap:8px;padding:8px 10px;background:var(--bar)}
textarea,input{border:0;border-radius:20px;padding:10px 14px;font:inherit;background:var(--other);color:var(--text);outline:none}
textarea{flex:1;resize:none;max-height:110px}
button{border:0;border-radius:50%;width:44px;height:44px;background:#00a884;color:#fff;font-size:20px;cursor:pointer}
#join{margin:auto;padding:24px;display:flex;flex-direction:column;gap:12px;width:min(340px,90%);text-align:center}
#join button{border-radius:20px;width:auto;height:auto;padding:12px;font-size:16px}
#join p{color:var(--sub);font-size:13px;margin:0}
.clip{background:transparent;color:var(--sub);font-size:24px;width:40px}
.m img{display:block;max-width:100%;max-height:300px;border-radius:6px;margin-bottom:4px;cursor:pointer}
.file{display:flex;align-items:center;gap:8px;padding:8px;background:rgba(0,0,0,.07);border-radius:6px;margin-bottom:4px;color:inherit;text-decoration:none}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file small{color:var(--sub)}
.hide{display:none!important}
</style>
</head>
<body>
<div id="join">
  <div style="font-size:48px">💬</div>
  <h2 style="margin:0">Messagerie</h2>
  <input id="pseudo" placeholder="Votre pseudo" maxlength="24">
  <input id="room" placeholder="Code du salon (ex. mon-salon-4821)" maxlength="48">
  <button id="enter">Entrer</button>
  <p>Toutes les personnes qui saisissent le même code se retrouvent dans la même discussion. Choisissez un code long et difficile à deviner.</p>
</div>
<header class="hide" id="head"><div class="av">💬</div><div><b id="title">Salon</b><small id="st">Connexion…</small></div><a id="leave">Quitter</a></header>
<div id="list" class="hide"></div>
<div class="bar hide" id="bar"><input type="file" id="file" class="hide"><button class="clip" id="clip" aria-label="Joindre un fichier">📎</button><textarea id="in" rows="1" placeholder="Écrire un message"></textarea><button id="go" aria-label="Envoyer">➤</button></div>
<script>
const $=id=>document.getElementById(id);
const RELAY='https://ntfy.sh/';
let pseudo,topic,es,uid,msgs=[],seen=new Set(),first=true;
uid=localStorage.getItem('msg_uid')||(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2));
localStorage.setItem('msg_uid',uid);
$('pseudo').value=localStorage.getItem('msg_pseudo')||'';
$('room').value=localStorage.getItem('msg_room')||'';

const hm=t=>new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const dayLabel=t=>{const d=new Date(t),n=new Date(),k=x=>x.toDateString();
  if(k(d)===k(n))return "Aujourd'hui";if(k(d)===k(new Date(n-864e5)))return 'Hier';
  return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})};

function render(){
  const list=$('list');
  const near=list.scrollHeight-list.scrollTop-list.clientHeight<120;
  list.textContent='';
  if(!msgs.length){const e=document.createElement('div');e.className='empty';e.textContent='Aucun message. Écrivez le premier !';list.append(e);return}
  let last='';
  for(const m of msgs){
    const dl=dayLabel(m.ts);
    if(dl!==last){const d=document.createElement('div');d.className='day';d.textContent=dl;list.append(d);last=dl}
    const el=document.createElement('div'),mine=m.uid===uid;
    el.className='m'+(mine?' me':'');
    if(!mine){const n=document.createElement('span');n.className='n';n.textContent=m.name;el.append(n)}
    if(m.att){
      const a=m.att,u=a.url,isImg=(a.type||'').startsWith('image/');
      const gone=()=>{const g=document.createElement('div');g.className='file';g.textContent='📎 Fichier expiré ('+a.name+')';return g};
      if(isImg){const im=document.createElement('img');im.src=u;im.alt=a.name;im.onclick=()=>window.open(u,'_blank');im.onerror=()=>im.replaceWith(gone());el.append(im)}
      else{const l=document.createElement('a');l.className='file';l.href=u;l.target='_blank';l.rel='noopener';l.download=a.name;
        const n=document.createElement('span');n.textContent='📄 '+a.name;const z=document.createElement('small');z.textContent=a.size?Math.max(1,Math.round(a.size/1024))+' Ko':'';
        l.append(n,z);el.append(l)}
    }
    if(m.text)el.append(document.createTextNode(m.text));
    const t=document.createElement('span');t.className='t';t.textContent=hm(m.ts);el.append(t);
    list.append(el);
  }
  if(near||first){list.scrollTop=list.scrollHeight;first=false}
}
function connect(){
  es=new EventSource(RELAY+topic+'/sse?since=all');
  es.onopen=()=>$('st').textContent='En ligne · temps réel';
  es.onerror=()=>$('st').textContent='Reconnexion…';
  es.onmessage=ev=>{
    try{
      const e=JSON.parse(ev.data);
      if(e.event!=='message'||seen.has(e.id))return;
      seen.add(e.id);
      const p=JSON.parse(e.message);
      if(!p||typeof p.text!=='string')return;
      msgs.push({uid:String(p.uid),name:String(p.name||'Anonyme').slice(0,24),text:p.text.slice(0,2000),ts:(e.time||0)*1000,att:e.attachment||null});
      msgs.sort((a,b)=>a.ts-b.ts);render();
    }catch(_){}
  };
}
async function send(){
  const text=$('in').value.trim();if(!text)return;
  $('in').value='';$('in').style.height='auto';
  try{
    const r=await fetch(RELAY+topic,{method:'POST',body:JSON.stringify({uid,name:pseudo,text:text.slice(0,2000)})});
    if(!r.ok)throw 0;
  }catch(_){$('in').value=text;$('st').textContent='Envoi impossible — nouvel essai possible'}
}
$('enter').onclick=()=>{
  pseudo=$('pseudo').value.trim();
  const room=$('room').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'-');
  if(!pseudo||room.length<4){alert('Entrez un pseudo et un code de salon (4 caractères minimum).');return}
  localStorage.setItem('msg_pseudo',pseudo);localStorage.setItem('msg_room',$('room').value.trim());
  topic='tchat-'+room;
  $('title').textContent='Salon · '+room;
  ['join'].forEach(i=>$(i).classList.add('hide'));
  ['head','list','bar'].forEach(i=>$(i).classList.remove('hide'));
  render();connect();
};
$('leave').onclick=()=>{if(es)es.close();msgs=[];seen.clear();first=true;
  ['head','list','bar'].forEach(i=>$(i).classList.add('hide'));$('join').classList.remove('hide')};
$('clip').onclick=()=>$('file').click();
$('file').onchange=async ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  if(f.size>15*1024*1024){alert('Fichier trop volumineux (15 Mo maximum).');return}
  const cap=$('in').value.trim();
  $('st').textContent='Envoi de '+f.name+'…';
  try{
    const meta=JSON.stringify({uid,name:pseudo,text:cap.slice(0,2000)});
    const r=await fetch(RELAY+topic+'?filename='+encodeURIComponent(f.name)+'&message='+encodeURIComponent(meta),{method:'PUT',body:f});
    if(!r.ok)throw 0;
    $('in').value='';$('in').style.height='auto';$('st').textContent='En ligne · temps réel';
  }catch(_){$('st').textContent='Échec de l’envoi du fichier'}
};
$('go').onclick=send;
$('in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('in').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'});
</script>
</body>
</html>
